name: Release Helm charts

on:
  push:
    branches:
      - main
    paths:
      - helm/**

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@main
        with:
          charts_dir: helm
          # Without this a chart edited without a version bump aborts the whole
          # run on "tag_name already_exists", leaving later charts unreleased
          # and index.yaml never regenerated.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
