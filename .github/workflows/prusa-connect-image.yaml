# Upstream publishes no container image, so build theirs (docker/server/Dockerfile) at a
# release tag. Bump PRUSA_CONNECT_REF here and imageTag in
# manifests/helm-controller-charts/prusa-connect.yaml to upgrade.
# The package is private on first push: make it public once in its GitHub settings.
name: Build Prusa Connect image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prusa-connect-image.yaml

env:
  PRUSA_CONNECT_REF: v0.1.0-beta.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: https://github.com/prusa3d/prusa-connect.git#${{ env.PRUSA_CONNECT_REF }}
          file: docker/server/Dockerfile
          platforms: linux/amd64
          build-args: BUILD_VERSION=${{ env.PRUSA_CONNECT_REF }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/prusa-connect:${{ env.PRUSA_CONNECT_REF }}
