# Connection defaults (user, key) live in ansible.cfg, not repeated per group.
jehlinet_hosts:
  hosts:
    pve: # PVE host (HP mini PC)
      ansible_host: 10.0.10.4
    holly: # Holly PVE host (NAS)
      ansible_host: 10.0.10.5
    printer-buddy: # RPi Zero W as a print/scanner server
      ansible_host: 10.0.20.230

jehlinet_vms:
  hosts:
    librarian: # MariaDB - Home Assistant's recorder DB (see playbooks/db/)
      ansible_host: 10.0.40.100
    omv:
      ansible_host: 10.0.40.201
    kube-captain:
      ansible_host: 10.0.40.102
    kube-worker:
      ansible_host: 10.0.40.104

# k3s cluster role groups (hosts defined above in jehlinet_vms)
k3s_server:
  hosts:
    kube-captain:

k3s_agents:
  hosts:
    kube-worker:
