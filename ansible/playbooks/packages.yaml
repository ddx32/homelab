---
# Patch every Debian host.
#
# Usage:
#   cd ansible && ansible-playbook playbooks/packages.yaml
#
# `apt: upgrade` takes update_cache itself, so this needs one play, not three.
# The Alpine play went with the avahi-reflect VM (removed 2026-09-03).
- name: Upgrade all packages
  hosts: jehlinet_hosts,jehlinet_vms
  become: true
  tasks:
    - name: Perform full system upgrade
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
        cache_valid_time: 3600
        autoclean: true
        autoremove: true
