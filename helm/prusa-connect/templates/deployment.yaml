apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  # One writer only (SQLite), and the RWO local volume can't be shared anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Set it: config.d is a local-path volume, so the pod must stay on the node that holds it.
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The setup wizard writes config.d/ beside the config file, so the file has to live on
        # the data volume: copied from the ConfigMap on every start (a subPath mount would
        # have kubelet create it as root on the root-squashed NFS export).
        # An empty local config.d is seeded from the NFS copy it replaced (/nfs/config.d).
        # Then upstream's gate: refuses to start a new version against state it can't migrate.
        - name: upgrade-check
          image: {{ .Values.image }}:{{ .Values.imageTag }}
          command: [/bin/sh, -ec]
          args:
            - >-
              cp /etc/prusa-connect/config.yaml /data/config.yaml;
              if [ ! -e /data/config.d/authz.db ] && [ -e /nfs/config.d/authz.db ]; then
                cp -R /nfs/config.d/. /data/config.d/;
              fi;
              if [ -e /data/config.d/authz.db ]; then
                exec /prusa_connect upgrade check -config /data/config.yaml;
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prusa-connect
              readOnly: true
            - name: data
              mountPath: /data
            - name: config-local
              mountPath: /data/config.d
            - name: data
              mountPath: /nfs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: server
          image: {{ .Values.image }}:{{ .Values.imageTag }}
          args: [core, -config, /data/config.yaml]
          ports:
            - name: api
              containerPort: {{ .Values.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /api/v1/health, port: api}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v1/health, port: api}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/v1/readiness, port: api}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/prusa-connect
              readOnly: true
            - name: data
              mountPath: /data
            - name: config-local
              mountPath: /data/config.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-pvc
        - name: config-local
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-config-local
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
