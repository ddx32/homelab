# Prusa Connect — web UI public at https://connect.jehli.net (cloudflare-tunnel). Printers use
# the LAN LoadBalancer instead, http://<node IP>:8080 (servicelb answers on 10.0.40.102 and .104).
#
# Print files are on the NAS at /export/ssd-data/prusa-connect, owned by 10001:10001, the image's
# user. config.d (the SQLite databases) is a local-path volume on kube-worker mounted over
# /data/config.d; the NFS config.d is the stale pre-move copy, used only to seed an empty volume.
# The share root needs "other::--x" in its ACL, or runc (root, squashed) can't make that mountpoint.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prusa-connect-data
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  nfs:
    path: /export/ssd-data/prusa-connect
    server: 10.0.40.201
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prusa-connect
  namespace: homelab-services
spec:
  repo: https://ddx32.github.io/homelab
  chart: prusa-connect
  targetNamespace: homelab-services
  version: 0.1.4
  valuesContent: |-
    imageTag: 0.1.0-beta.2
    host: connect.jehli.net
    # config.d (the SQLite databases) is node-local; kube-worker is off pve (hard freezes).
    nodeSelector:
      kubernetes.io/hostname: kube-worker
