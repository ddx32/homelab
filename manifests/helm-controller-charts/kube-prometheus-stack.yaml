apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetNamespace: monitoring
  version: 72.4.0
  valuesContent: |-
    fullnameOverride: kube-prometheus-stack
    namespaceOverride: monitoring
    # TLS terminates at Cloudflare, so no tls: block and no cert-manager annotation.
    # These previously used the deprecated kubernetes.io/ingress.class annotation, which
    # modern ingress-nginx ignores - that is why no controller ever served them.
    #
    # SECURITY: Prometheus and Alertmanager have no built-in authentication. Both need a
    # Cloudflare Access policy; Access on jehli.net is per-application, not a wildcard.
    prometheus:
      ingress:
        enabled: true
        ingressClassName: cloudflare-tunnel
        hosts:
          - prometheus.jehli.net
    grafana:
      ingress:
        enabled: true
        ingressClassName: cloudflare-tunnel
        hosts:
          - grafana.jehli.net
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: cloudflare-tunnel
        hosts:
          - alertmanager.jehli.net
