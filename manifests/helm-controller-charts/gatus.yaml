# Gatus status page — LAN/Tailscale only, http://status.lan.jehli.net (router A record
# → 10.0.40.102; servicelb answers on both node IPs). No Ingress on purpose: it lists
# internal addresses.
#
# Gatus watches its config file, and the ConfigMap is mounted as a directory (not subPath),
# so `kubectl apply -f` of this file is picked up within a minute without a restart.
#
# History is SQLite on the NAS (/export/ssd-data/gatus, root:users 2777 like mosquitto's,
# because the export squashes root). One replica with Recreate, so only one writer ever
# touches the database: SQLite's locking is not reliable over NFS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: homelab-services
data:
  config.yaml: |
    ui:
      title: Status · jehli.net homelab
      header: jehli.net homelab
      dashboard-heading: Homelab status
      dashboard-subheading: Every service, host and network device, checked every minute
      default-sort-by: group  # default is name, which flattens the groups into one A-Z list
      # App icons. Gatus has no per-endpoint icon field, so CSS hangs one off each card's title
      # span (its title attribute is the endpoint name: renaming an endpoint drops its icon).
      # Inlined so the page needs no internet and no CDN (jsDelivr 403s this repo, >50 MB).
      # Source: homarr-labs/dashboard-icons @ d4b500d. A new line:
      #   curl -s https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/<icon>.svg | base64
      custom-css: |
        .endpoint span[role=link]::before { content: ""; display: inline-block; width: 1.3em; height: 1.3em;
          margin-right: .5em; vertical-align: -.3em; background: center / contain no-repeat; }
        /* home-assistant */ .endpoint span[role=link][title="Home Assistant"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* esphome */ .endpoint span[role=link][title="ESPHome"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* homebridge */ .endpoint span[role=link][title="Homebridge"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* mosquitto */ .endpoint span[role=link][title="Mosquitto (MQTT)"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* valetudo */ .endpoint span[role=link][title="Dobby robot"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* jellyfin */ .endpoint span[role=link][title="Jellyfin"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* navidrome */ .endpoint span[role=link][title="Navidrome"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* sonarr */ .endpoint span[role=link][title="Sonarr"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* radarr */ .endpoint span[role=link][title="Radarr"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* prowlarr */ .endpoint span[role=link][title="Prowlarr"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* deluge */ .endpoint span[role=link][title="Deluge"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* flaresolverr */ .endpoint span[role=link][title="FlareSolverr"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* grafana */ .endpoint span[role=link][title="Grafana"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* prometheus */ .endpoint span[role=link][title="Prometheus"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* alertmanager */ .endpoint span[role=link][title="Alertmanager"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* k3s */ .endpoint span[role=link][title="k3s API"]::before, .endpoint span[role=link][title="kube-worker"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* cloudflare */ .endpoint span[role=link][title="Cloudflare tunnel"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* proxmox */ .endpoint span[role=link][title="pve (Proxmox)"]::before, .endpoint span[role=link][title="holly (Proxmox)"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* openmediavault */ .endpoint span[role=link][title="omv web UI"]::before, .endpoint span[role=link][title="omv NFS"]::before, .endpoint span[role=link][title="omv SMB"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* mariadb */ .endpoint span[role=link][title="librarian MariaDB"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* adminer */ .endpoint span[role=link][title="Adminer"]::before { background-image: url(data:image/svg+xml;base64,); }
        /* mikrotik */ .endpoint span[role=link][title="Router (hEX)"]::before, .endpoint span[role=link][title="Switch (CRS310)"]::before, .endpoint span[role=link][title="AP (hAP ax S)"]::before, .endpoint span[role=link][title="LAN DNS"]::before { background-image: url(data:image/svg+xml;base64,); }
    storage:
      type: sqlite
      path: /data/gatus.db

    x-up: &up ["[CONNECTED] == true", "[STATUS] < 500"]
    x-ok: &ok ["[STATUS] == 200"]
    x-conn: &conn ["[CONNECTED] == true"]

    endpoints:
      # --- 🏠 Smart home ---
      - {name: Home Assistant, group: "🏠 Smart home", url: "http://10.0.40.102:8123", conditions: *up}
      - {name: ESPHome, group: "🏠 Smart home", url: "http://esphome-service.homeassistant:6052", conditions: *up}
      - {name: Homebridge, group: "🏠 Smart home", url: "http://homebridge-service.homeassistant:8581", conditions: *up}
      - {name: Mosquitto (MQTT), group: "🏠 Smart home", url: "tcp://mosquitto.homeassistant:1883", conditions: *conn}
      - {name: Dobby robot, group: "🏠 Smart home", url: "http://10.0.20.251", conditions: *up}

      # --- 🎬 Media ---
      - {name: Jellyfin, group: "🎬 Media", url: "http://jellyfin.jellyfin:8096/health", conditions: *ok}
      - {name: Navidrome, group: "🎬 Media", url: "http://navidrome.navidrome/ping", conditions: *up}

      # --- 📥 Downloads ---
      - {name: Sonarr, group: "📥 Downloads", url: "http://sonarr.media-stack/ping", conditions: *up}
      - {name: Radarr, group: "📥 Downloads", url: "http://radarr.media-stack/ping", conditions: *up}
      - {name: Prowlarr, group: "📥 Downloads", url: "http://prowlarr.media-stack/ping", conditions: *up}
      - {name: Deluge, group: "📥 Downloads", url: "http://deluge.media-stack", conditions: *up}
      - {name: FlareSolverr, group: "📥 Downloads", url: "http://flaresolverr.media-stack:8191/health", conditions: *ok}

      # --- 📊 Monitoring ---
      - {name: Grafana, group: "📊 Monitoring", url: "http://kube-prometheus-stack-grafana.monitoring/api/health", conditions: *ok}
      - {name: Prometheus, group: "📊 Monitoring", url: "http://kube-prometheus-stack-prometheus.monitoring:9090/-/ready", conditions: *ok}
      - {name: Alertmanager, group: "📊 Monitoring", url: "http://kube-prometheus-stack-alertmanager.monitoring:9093/-/ready", conditions: *ok}

      # --- ☸️ Kubernetes ---
      - {name: k3s API, group: "☸️ Kubernetes", url: "tcp://10.0.40.102:6443", conditions: *conn}
      - {name: kube-worker, group: "☸️ Kubernetes", url: "icmp://10.0.40.104", conditions: *conn}
      - {name: Cloudflare tunnel, group: "☸️ Kubernetes", url: "https://ha.jehli.net", conditions: *up}

      # --- 🖥️ Servers & storage ---
      - {name: pve (Proxmox), group: "🖥️ Servers & storage", url: "https://10.0.10.4:8006", client: {insecure: true}, conditions: *up}
      - {name: holly (Proxmox), group: "🖥️ Servers & storage", url: "https://10.0.10.5:8006", client: {insecure: true}, conditions: *up}
      - {name: omv web UI, group: "🖥️ Servers & storage", url: "http://10.0.40.201", conditions: *up}
      - {name: omv NFS, group: "🖥️ Servers & storage", url: "tcp://10.0.40.201:2049", conditions: *conn}
      - {name: omv SMB, group: "🖥️ Servers & storage", url: "tcp://10.0.40.201:445", conditions: *conn}
      - {name: librarian MariaDB, group: "🖥️ Servers & storage", url: "tcp://10.0.40.100:3306", conditions: *conn}
      - {name: Adminer, group: "🖥️ Servers & storage", url: "http://adminer.homelab-services:8080", conditions: *up}

      # --- 🌐 Network ---
      - {name: Router (hEX), group: "🌐 Network", url: "icmp://10.0.10.1", conditions: *conn}
      - {name: Switch (CRS310), group: "🌐 Network", url: "icmp://10.0.10.2", conditions: *conn}
      - {name: AP (hAP ax S), group: "🌐 Network", url: "icmp://192.168.0.4", conditions: *conn}
      - name: LAN DNS
        group: "🌐 Network"
        # Router's vlan40 address: from pods, queries to 10.0.10.1 time out (they go via the
        # CRS310's L3 route and the reply comes back on a different path).
        url: "10.0.40.1"
        dns: {query-name: nas.lan.jehli.net, query-type: A}
        conditions: ["[DNS_RCODE] == NOERROR", "[BODY] == 10.0.40.201"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: homelab-services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.38.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
          ports:
            - containerPort: 8080
          securityContext:
            capabilities:
              add: [NET_RAW] # icmp:// checks
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: homelab-services
spec:
  type: LoadBalancer
  selector:
    app: gatus
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gatus-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  nfs:
    path: /export/ssd-data/gatus
    server: 10.0.40.201
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data-pvc
  namespace: homelab-services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: gatus-data-pv
  storageClassName: nfs
