apiVersion: v1
kind: Namespace
metadata:
  name: media-stack
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sonarr
  namespace: media-stack
spec:
  repo: https://ddx32.github.io/homelab
  chart: sonarr
  targetNamespace: media-stack
  version: 0.1.3
  valuesContent: |-
    version: release-4.0.20.3014
    nfs:
      server: 10.0.40.201
      paths:
        config: /export/ssd-data/sonarr/config
        media: /export/media-library
    ingress:
      host: sonarr.jehli.net
    ingressClassName: cloudflare-tunnel
    # /config is node-local; kube-worker is off pve (hard freezes) and next to omv.
    nodeSelector:
      kubernetes.io/hostname: kube-worker
